<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Глава</title>
<meta name="description" content="Глава: книги, чтение и голос в одном приложении.">
<meta name="theme-color" content="#0F2B24">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Placeholder cover while the app is being built: one centred title page. */
:root{--bg:#0F2B24;--ink:#F3ECDA;--muted:#A9B8A9;--gold:#D8B25A;--gold-hi:#F4DFA0;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;align-items:center;justify-content:center;padding:24px;color:var(--ink);font-family:'Onest','Helvetica Neue',Helvetica,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background-color:var(--bg);
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px)}
main{max-width:340px;display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.rule{width:56px;height:1px;background:var(--gold)}
h1{margin:0;font-family:'Cormorant','Times New Roman',serif;font-style:italic;font-weight:600;font-size:72px;line-height:1}
p{margin:0;color:var(--muted)}
a{display:inline-flex;align-items:center;min-height:46px;padding:0 22px;border-radius:23px;border:1px solid var(--gold);color:var(--gold-hi);font-weight:600;text-decoration:none}
a:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
</style>
</head>
<body>
<main>
  <div class="rule"></div>
  <h1>Глава</h1>
  <p>Приложение для чтения ещё собирается. Пока здесь можно послушать, каким голосом оно будет читать книги.</p>
  <a href="voice-test/">Проверка голоса</a>
</main>
</body>
</html>
