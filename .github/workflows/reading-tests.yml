name: Reading tests

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reading-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reader:
    name: Reader / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Unit tests
        run: npm run test:unit
      - name: Real reader integration tests
        run: npm run test:browser -- --project=${{ matrix.browser }}
      - name: Browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-${{ matrix.browser }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
